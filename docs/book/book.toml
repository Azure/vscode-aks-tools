[book]
authors = ["Tatsat Mishra"]
language = "en"
multilingual = false
src = "src"
title = "Visual Studio Code AKS Tools"
description = "Display Azure Kubernetes Services within VS Code"

# Fail the build when SUMMARY.md references a page that does not exist. Without this,
# mdBook silently creates a stub and publishes a blank page.
[build]
create-missing = false

[preprocessor.toc]
command = "mdbook-toc"

[output.html]
curly-quotes = true
git-repository-url = "https://github.com/Azure/vscode-aks-tools"
