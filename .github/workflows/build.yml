name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    permissions:
      actions: read
      contents: read
      deployments: read
      packages: none
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        disable-sudo: true
        disable-telemetry: true
        egress-policy: block
        allowed-endpoints: >
          api.github.com:443
          devdiv.pkgs.visualstudio.com:443
          github.com:443
          marketplace.visualstudio.com:443
          nodejs.org:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          update.code.visualstudio.com:443
          vscode.download.prss.microsoft.com:443

    - name: Checkout Branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
    - name: Build Extension
      run: |
        npm run install:all
    - name: Lint
      run: npm run lint:all
    - name: Smoke test (Linux)
      run: xvfb-run -a npm run test
      if: runner.os == 'Linux'
    - name: Smoke test (Mac, Windows)
      run: npm run test
      if: runner.os != 'Linux'
    - name: Package Extension
      if: matrix.os == 'ubuntu-latest'
      run: |
        npm run package
        mkdir vsix
        mv *.vsix vsix
    - name: Archive Extension
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vsix
        path: vsix
