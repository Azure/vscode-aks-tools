version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 1,15 * *"
    # Bake newly released versions for 1 week before proposing them. This gives an
    # internal evaluation window and avoids proposing versions that are not yet
    # mirrored in the internal package feed proxy.
    cooldown:
      default-days: 7
    groups:
      npm-root:
        # Excluded so it gets its own PR: bumping @types/vscode forces a
        # matching engines.vscode bump, which raises the minimum VS Code
        # version and needs a deliberate decision.
        exclude-patterns:
          - "@types/vscode"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/webview-ui"
    schedule:
      interval: "cron"
      cronjob: "0 8 1,15 * *"
    cooldown:
      default-days: 7
    groups:
      npm-webview-ui:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 1,15 * *"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
