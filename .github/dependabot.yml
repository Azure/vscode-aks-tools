version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Bake newly released versions for 1 week before proposing them. This gives an
    # internal evaluation window and avoids proposing versions that are not yet
    # mirrored in the internal package feed proxy.
    cooldown:
      default-days: 7
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
  - package-ecosystem: "npm"
    directory: "/webview-ui"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
